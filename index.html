<!-- STEP 1: HISTORICAL BIOGRAPHY & DECADE NEWS MODULE -->
<script>
  // Extend the existing simulation engine with historical and biographical tracking
  if (window.sim) {
    window.sim.historicalArchive = {
      epochs: [
        { name: "Industrial Foundation", startCyc: 0, focus: "Capital accumulation and manual labor optimization" },
        { name: "Information Age", startCyc: 500, focus: "R&D acceleration, automation, and algorithmic market trading" },
        { name: "Orbital Era", startCyc: 1000, focus: "Space colonization, satellite infrastructure, and green tech adaptation" }
      ],
      notableBiographies: [
        { name: "Atlas Solaris", role: "Pioneer Industrialist", milestone: "Established initial enterprise capital structures." },
        { name: "Nova Vanguard", role: "Financial Strategist", milestone: "Optimized early household savings vaults and market liquidity." }
      ],
      injectHistoricalContext() {
        const currentEpoch = this.epochs.find(e => window.sim.cycle >= e.startCyc) || this.epochs[0];
        if (window.sim.cycle % 100 === 0) {
          window.sim.log("history", `Historical Epoch Active: [${currentEpoch.name}] - Focus: ${currentEpoch.focus}`, "📜");
        }
      }
    };

    // Hook into the existing step loop safely
    const originalStep = window.sim.step;
    window.sim.step = function() {
      originalStep.call(this);
      this.historicalArchive.injectHistoricalContext();
    };
    
    console.log("Step 1: Historical Biographies & News Module successfully attached to simulation engine.");
  }
</script>

<!-- STEP 4: ANIMATED TRADE CARAVANS & GRID PATHFINDING SUB-MODULE -->
<script>
  if (window.sim && typeof scene !== 'undefined') {
    window.sim.caravanSystem = {
      caravans: [
        { id: "cart_1", origin: "Agri Farm", dest: "Exchange", progress: 0.0, speed: 0.05 },
        { id: "cart_2", origin: "Foundry", dest: "Exchange", progress: 0.5, speed: 0.04 }
      ],
      meshGroup: [],
      init() {
        this.caravans.forEach(c => {
          const geo = new THREE.BoxGeometry(0.4, 0.3, 0.6);
          const mat = new THREE.MeshToonMaterial({ color: 0xf1faee });
          const mesh = new THREE.Mesh(geo, mat);
          scene.add(mesh);
          this.meshGroup.push({ data: c, mesh: mesh });
        });
        window.sim.log("history", "Trade caravan transport network established across regional grid.", "🛒");
      },
      updateCaravans() {
        this.meshGroup.forEach(item => {
          item.data.progress += item.data.speed;
          if (item.data.progress > 1.0) item.data.progress = 0.0;
          let x = -16 + item.data.progress * 16;
          let z = 6 + Math.sin(item.data.progress * Math.PI * 2) * 2;
          item.mesh.position.set(x, 0.3, z);
        });
        if (window.sim.cycle > 0 && window.sim.cycle % 90 === 0) {
          window.sim.log("history", "Logistics Update: Trade caravan completed transport route with zero grid friction.", "📦");
        }
      }
    };

    window.sim.caravanSystem.init();

    // Safely chain into the existing step loop
    const originalStepStep4 = window.sim.step;
    window.sim.step = function() {
      originalStepStep4.call(this);
      this.caravanSystem.updateCaravans();
    };
    
    console.log("Step 4: Animated Trade Caravans & Grid Pathfinding Sub-Module successfully attached.");
  }
</script>
<!-- STEP 5: HISTORICAL CANVAS CHARTS & INTERACTIVE UI EXPLANATIONS -->
<script>
  if (window.sim && document.getElementById('tabBar')) {
    // Dynamically inject a new tab button for Charts/Analytics
    const tabBar = document.getElementById('tabBar');
    const chartBtn = document.createElement('button');
    chartBtn.className = 'tab-btn';
    chartBtn.innerText = '📊 CHARTS';
    chartBtn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.soc-card').forEach(c => c.classList.remove('active-card'));
      chartBtn.classList.add('active');
      document.getElementById('c-charts').classList.add('active-card');
      if (window.sim.chartModule) window.sim.chartModule.drawChart();
    };
    tabBar.appendChild(chartBtn);

    // Dynamically inject the card container into the HUD sidebar
    const sidebar = document.querySelector('.hud-sidebar');
    const chartCard = document.createElement('div');
    chartCard.id = 'c-charts';
    chartCard.className = 'soc-card';
    chartCard.style.borderLeft = '4px solid #ff79c6';
    chartCard.innerHTML = `
      <h2>ANALYTICS & CHARTS <span>📈 VISUAL FEED</span></h2>
      <div class="stat-row"><span>Market Trend Velocity:</span><span class="stat-num" id="ui-velocity">+2.4%</span></div>
      <canvas id="marketCanvas" width="370" height="150" style="width:100%; height:130px; background:#0f111a; border-radius:4px; margin-top:4px; border:1px solid #3b4252; display:block;"></canvas>
      <div style="margin-top:6px; font-size:10px; color:#6272a4; font-weight:600;" id="eli5-feed">ELI5: Capital aggregates organically from micro-enterprise production into national economic growth.</div>
    `;
    sidebar.appendChild(chartCard);

    // Chart rendering logic
    window.sim.chartModule = {
      drawChart() {
        const canvas = document.getElementById('marketCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw background grid lines
        ctx.strokeStyle = '#282c3d';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=0; i<canvas.width; i+=30) { ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); }
        for(let j=0; j<canvas.height; j+=30) { ctx.moveTo(0,j); ctx.lineTo(canvas.width,j); }
        ctx.stroke();

        // Draw live line graph based on enterprise capital valuations
        ctx.strokeStyle = '#50fa7b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        let points = window.sim.ents.map((e, idx) => ({
          x: 40 + idx * 140,
          y: canvas.height - ((e.cap || 100) % 120) * 0.9 - 25
        }));
        
        ctx.moveTo(10, canvas.height - 40);
        points.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.lineTo(canvas.width - 10, canvas.height - 30);
        ctx.stroke();
      }
    };

    // Safely chain into the existing step loop
    const originalStepStep5 = window.sim.step;
    window.sim.step = function() {
      originalStepStep5.call(this);
      if (this.chartModule && this.cycle % 10 === 0) {
        this.chartModule.drawChart();
      }
    };
    
    console.log("Step 5: Historical Canvas Charts & Interactive UI Explanations successfully attached.");
  }
</script>
