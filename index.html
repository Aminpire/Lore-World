<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lore World - Phase 2 Neural Agents</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Outfit:wght@700;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f111a; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; min-height: 100vh; display: flex; flex-direction: column; padding: 6px; user-select: none; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #1e2230; border: 2px solid #3b4252; border-left: 6px solid #ff79c6; border-radius: 8px; box-shadow: 0 4px 0 #000; margin-bottom: 6px; }
    .brand-title { font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 900; color: #ff79c6; letter-spacing: 1px; text-transform: uppercase; }
    .badge-bar { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    .hud-badge { font-family: 'Outfit', sans-serif; font-size: 0.55rem; font-weight: 700; background: #282c3d; color: #8be9fd; padding: 3px 6px; border: 2px solid #44475a; border-radius: 4px; }
    .ctrl-btn { background: #282c3d; color: #f8fafc; border: 2px solid #44475a; border-radius: 5px; padding: 3px 7px; font-family: 'Outfit', sans-serif; font-size: 0.55rem; font-weight: 700; cursor: pointer; transition: all 0.1s ease; box-shadow: 0 2px 0 #000; }
    .ctrl-btn:hover { background: #44475a; }
    .ctrl-btn:active { transform: translateY(2px); box-shadow: none; }
    .toggle-active { background: #50fa7b !important; border-color: #2e8b57 !important; color: #000 !important; }
    .main-grid { display: flex; flex-direction: column; gap: 6px; }
    @media (min-width: 1024px) { .main-grid { display: grid; grid-template-columns: 1fr 410px; } }
    .viewport-box { background: #090a0f; border: 2px solid #3b4252; border-radius: 8px; position: relative; overflow: hidden; width: 100%; height: 460px; box-shadow: inset 0 0 20px #000; }
    #webglContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: block; }
    #webglContainer canvas { width: 100% !important; height: 100% !important; display: block; }
    .hud-sidebar { display: flex; flex-direction: column; gap: 6px; max-height: 88vh; overflow-y: auto; padding-right: 2px; }
    .tab-bar { display: flex; flex-wrap: wrap; gap: 2px; background: #161822; padding: 3px; border: 2px solid #3b4252; border-radius: 6px; }
    .tab-btn { flex: 1 1 30%; padding: 4px 1px; background: transparent; border: none; color: #6272a4; font-family: 'Outfit', sans-serif; font-size: 0.35rem; font-weight: 700; cursor: pointer; border-radius: 3px; text-align: center; }
    .tab-btn.active { background: #282c3d; color: #ff79c6; border: 1px solid #6272a4; }
    .soc-card { background: #181b25; border: 2px solid #3b4252; border-radius: 8px; padding: 8px 10px; box-shadow: 0 3px 0 #000; display: none; }
    .soc-card.active-card { display: block; }
    .soc-card h2 { font-family: 'Outfit', sans-serif; font-size: 0.65rem; font-weight: 900; color: #f8fafc; margin-bottom: 6px; letter-spacing: 0.5px; border-bottom: 2px solid #282c3d; padding-bottom: 4px; text-transform: uppercase; }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 3px; font-size: 12px; font-weight: 700; }
    .stat-num { color: #50fa7b; font-weight: 900; font-family: 'Outfit', sans-serif; font-size: 11px; }
    .log-container { max-height: 330px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding: 4px; }
    .log-entry { background: #0f111a; border: 2px solid #282c3d; border-left: 4px solid #ff79c6; border-radius: 5px; padding: 6px 8px; font-size: 11px; }
    .log-time { font-family: 'Outfit', sans-serif; font-size: 9px; font-weight: 700; color: #6272a4; margin-bottom: 2px; }
    .log-text { color: #f8fafc; font-weight: 600; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <header>
    <div class="brand-title"><span>✒️</span> LORE WORLD (PHASE 2)</div>
    <div class="badge-bar">
      <button class="ctrl-btn toggle-active" id="btn3D" onclick="toggle3D()">TOON 3D</button>
      <span class="hud-badge" id="tickCount">CYC 0000</span>
    </div>
  </header>

  <div class="main-grid">
    <div class="viewport-box"><div id="webglContainer"></div></div>

    <div class="hud-sidebar">
      <div class="tab-bar" id="tabBar"></div>
      
      <!-- AGENTS -->
      <div id="c-agents" class="soc-card active-card" style="border-left: 4px solid #50fa7b;">
        <h2>NEURAL AGENTS <span>🧠 AI</span></h2>
        <div class="stat-row"><span>Active Population:</span><span class="stat-num" id="ui-pop">4</span></div>
        <div class="stat-row"><span>Auto-Fixes:</span><span class="stat-num" id="ui-fixes">0</span></div>
        <div class="log-container" id="l-agents"></div>
      </div>

      <!-- LOGS -->
      <div id="c-logs" class="soc-card" style="border-left: 4px solid #8be9fd;">
        <h2>CHRONICLE <span>📜 LOGS</span></h2>
        <div class="log-container" id="l-logs"></div>
      </div>
    </div>
  </div>

  <script>
    let totalFixes = 0;
    window.onerror = function(msg) {
      totalFixes++;
      const el = document.getElementById("ui-fixes");
      if(el) el.innerText = totalFixes;
      console.warn("Guardian Intercept:", msg);
      return true;
    };

    const TABS = ["agents", "logs"];
    const ICONS = ["AGENTS", "📜 LOGS"];
    const bar = document.getElementById("tabBar");
    TABS.forEach((t, i) => {
      const b = document.createElement("button");
      b.className = `tab-btn ${i===0?'active':''}`;
      b.innerText = ICONS[i];
      b.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.soc-card').forEach(c => c.classList.remove('active-card'));
        b.classList.add('active');
        document.getElementById(`c-${t}`).classList.add('active-card');
      };
      bar.appendChild(b);
    });

    let render3D = true;
    function toggle3D() { render3D = !render3D; document.getElementById("btn3D").classList.toggle("toggle-active", render3D); }

    function setTxt(id, val) { const el = document.getElementById(id); if (el) el.innerText = val; }
    function setHTML(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }

    class NeuralPolicyBrain {
      constructor(i=12, h=10, o=11) {
        this.w1 = Array.from({length: h}, ()=>Array.from({length: i}, ()=>Math.random()*0.2-0.1));
        this.b1 = Array(h).fill(0);
        this.w2 = Array.from({length: o}, ()=>Array.from({length: h}, ()=>Math.random()*0.2-0.1));
        this.b2 = Array(o).fill(0);
      }
      forward(x) {
        let h = this.w1.map((r,i) => Math.tanh(r.reduce((s, w, j) => s + w*(x[j]||0), this.b1[i])));
        return this.w2.map((r,i) => r.reduce((s, w, j) => s + w*h[j], this.b2[i]));
      }
    }

    class SimulationEnginePhase2 {
      constructor() {
        this.cycle = 0;
        this.agents = [
          { id: 1, name: "Atlas Solaris", x: 12, y: 14, wallet: 25, brain: new NeuralPolicyBrain() },
          { id: 2, name: "Nova Vanguard", x: 34, y: 14, wallet: 30, brain: new NeuralPolicyBrain() },
          { id: 3, name: "Caleb Terra", x: 12, y: 26, wallet: 20, brain: new NeuralPolicyBrain() },
          { id: 4, name: "Naomi Aether", x: 34, y: 26, wallet: 35, brain: new NeuralPolicyBrain() }
        ];
        this.logs = [{ c: 0, t: "Phase 2 Neural Agents initialized with Q-learning brains." }];
      }
      step() {
        this.cycle++;
        this.agents.forEach(a => {
          let q = a.brain.forward([1, 1, 1, 0.5, 0.5, 0.5, 0.5, 1, 0.03, 0.05, 0.8, 1]);
          let action = q.indexOf(Math.max(...q));
          if (action % 2 === 0) {
            a.x += (Math.random() - 0.5) * 1.5;
            a.y += (Math.random() - 0.5) * 1.5;
            a.x = Math.max(2, Math.min(46, a.x));
            a.y = Math.max(2, Math.min(30, a.y));
          } else {
            a.wallet += 0.5;
          }
        });
      }
      refreshUI() {
        setTxt("tickCount", `CYC ${String(this.cycle).padStart(4, '0')}`);
        setTxt("ui-pop", this.agents.length);
        setHTML("l-agents", this.agents.map(a => `<div class="log-entry"><div class="log-time">AGENT #${a.id} (${a.name})</div><div class="log-text">Pos: (${a.x.toFixed(1)}, ${a.y.toFixed(1)}) | Wallet: ${a.wallet.toFixed(1)}C</div></div>`).join(''));
        setHTML("l-logs", this.logs.map(i => `<div class="log-entry"><div class="log-time">CYC ${i.c}</div><div class="log-text">${i.t}</div></div>`).join(''));
      }
    }

    const sim = new SimulationEnginePhase2();
    window.sim = sim;

    // Three.js Setup with Agent Spheres
    const container = document.getElementById("webglContainer");
    const width = container.clientWidth || 560; const height = container.clientHeight || 460;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f111a);

    const camera = new THREE.PerspectiveCamera(40, width/height, 0.1, 1000);
    camera.position.set(0, 32, 34); camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(20, 35, 20); scene.add(dirLight);

    const grid = new THREE.GridHelper(48, 24, 0xff79c6, 0x3b4252);
    grid.position.set(0, 0, 0); scene.add(grid);

    const agentMeshes = sim.agents.map(() => {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 16, 16),
        new THREE.MeshToonMaterial({ color: 0x50fa7b })
      );
      scene.add(m);
      return m;
    });

    window.addEventListener("resize", () => {
      const w = container.clientWidth || 560; const h = container.clientHeight || 460;
      camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
    });

    function loop() {
      sim.step();
      sim.agents.forEach((a, idx) => {
        if(agentMeshes[idx]) {
          agentMeshes[idx].position.set(a.x - 24, 0.5, a.y - 16);
        }
      });
      if (render3D) {
        renderer.render(scene, camera);
      }
      sim.refreshUI();
      setTimeout(loop, 100);
    }
    loop();
  </script>
</body>
</html>
